<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Preparing Download</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            background: #0f172a;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        .container {

            width: 100%;

            max-width: 600px;

        }


        .card {

            background: #1e293b;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 20px 50px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

            text-align: center;

        }


        h1 {

            margin:
                0 0 10px 0;

            font-size: 26px;

        }


        .description {

            color: #94a3b8;

            line-height: 1.6;

            margin-bottom: 25px;

        }


        .ad {

            width: 100%;

            min-height: 100px;

            border:
                1px dashed
                #475569;

            border-radius: 10px;

            background: #0f172a;

            display: flex;

            justify-content: center;

            align-items: center;

            margin-bottom: 25px;

            color: #64748b;

            font-size: 13px;

            overflow: hidden;

        }


        #countdown {

            font-size: 48px;

            font-weight: bold;

            margin: 20px 0;

        }


        #status {

            color: #94a3b8;

            margin-bottom: 20px;

        }


        #downloadButton {

            display: none;

            width: 100%;

            padding: 15px;

            background: #22c55e;

            color: white;

            border: none;

            border-radius: 9px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        #downloadButton:hover {

            background: #16a34a;

        }


        .error {

            display: none;

            background: #7f1d1d;

            color: #fecaca;

            padding: 12px;

            border-radius: 8px;

            margin-top: 20px;

            line-height: 1.5;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="card">


        <h1>
            Preparing Download
        </h1>


        <p class="description">

            Please wait while we prepare
            your video for download.

        </p>


        <!-- AD -->

        <div class="ad">

            ADVERTISEMENT

        </div>


        <!-- STATUS -->

        <div id="status">

            Preparing your download...

        </div>


        <!-- COUNTDOWN -->

        <div id="countdown">

            5

        </div>


        <!-- DOWNLOAD FORM -->

        <form
            id="downloadForm"
            action="/download"
            method="POST"
        >

            <input
                type="hidden"
                name="url"
                value="{{ url }}"
            >


            <input
                type="hidden"
                name="quality"
                value="{{ quality }}"
            >


            <button
                type="submit"
                id="downloadButton"
            >

                Download Video

            </button>

        </form>


        <div
            id="error"
            class="error"
        ></div>


    </div>


</div>


<script>

    let seconds = 5;


    const countdown =
        document.getElementById(
            "countdown"
        );


    const status =
        document.getElementById(
            "status"
        );


    const button =
        document.getElementById(
            "downloadButton"
        );


    const timer =
        setInterval(
            function () {

                seconds--;

                countdown.textContent =
                    seconds;


                if (seconds <= 0) {

                    clearInterval(timer);


                    countdown.textContent =
                        "✓";


                    status.textContent =
                        "Your video is ready.";


                    button.style.display =
                        "block";

                }

            },
            1000
        );


</script>


</body>

</html>
