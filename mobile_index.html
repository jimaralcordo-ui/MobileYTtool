<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YTTool Mobile</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        .container {

            width: 100%;

            max-width: 600px;

        }


        .logo {

            text-align: center;

            font-size: 36px;

            font-weight: bold;

            margin-bottom: 10px;

            letter-spacing: -1px;

        }


        .logo span {

            color: #ef4444;

        }


        .description {

            text-align: center;

            color: #94a3b8;

            margin-bottom: 30px;

            line-height: 1.6;

        }


        .card {

            background: #1e293b;

            padding: 25px;

            border-radius: 18px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.35);

        }


        h1 {

            text-align: center;

            font-size: 24px;

            margin-bottom: 10px;

        }


        .text {

            text-align: center;

            color: #94a3b8;

            line-height: 1.6;

            margin-bottom: 25px;

        }


        .error {

            background: #7f1d1d;

            color: #fecaca;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            line-height: 1.5;

            word-break: break-word;

        }


        .input-area {

            width: 100%;

        }


        input {

            width: 100%;

            padding: 15px;

            border:
                1px solid
                #475569;

            border-radius: 9px;

            background: #0f172a;

            color: white;

            font-size: 15px;

            outline: none;

            margin-bottom: 12px;

        }


        input::placeholder {

            color: #64748b;

        }


        input:focus {

            border-color: #ef4444;

            box-shadow:
                0 0 0 3px
                rgba(
                    239,
                    68,
                    68,
                    0.15
                );

        }


        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 9px;

            background: #ef4444;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.2s;

        }


        button:hover {

            background: #dc2626;

            transform:
                translateY(-1px);

        }


        button:active {

            transform:
                translateY(0);

        }


        .ad {

            width: 100%;

            min-height: 100px;

            margin-top: 25px;

            border:
                1px dashed
                #475569;

            border-radius: 10px;

            display: flex;

            justify-content: center;

            align-items: center;

            color: #64748b;

            font-size: 13px;

        }


        .note {

            text-align: center;

            color: #64748b;

            font-size: 13px;

            margin-top: 20px;

            line-height: 1.5;

        }


        .footer {

            text-align: center;

            color: #64748b;

            font-size: 13px;

            margin-top: 25px;

            line-height: 1.7;

        }


        .creator {

            color: #94a3b8;

            font-weight: 600;

        }


        .creator span {

            color: #ef4444;

        }


        @media (max-width: 600px) {

            body {

                padding: 15px;

                align-items: center;

            }


            .card {

                padding: 20px;

            }


            .logo {

                font-size: 32px;

            }


            h1 {

                font-size: 22px;

            }

        }

    </style>

</head>


<body>


    <main class="container">


        <!-- ==================================================
             LOGO
        ================================================== -->

        <div class="logo">

            YT<span>Tool</span>

        </div>


        <div class="description">

            A simple and fast YouTube video downloader.

        </div>


        <!-- ==================================================
             CARD
        ================================================== -->

        <section class="card">


            <h1>

                YouTube Video Downloader

            </h1>


            <p class="text">

                Paste a YouTube video URL below to get started.

            </p>


            <!-- ==================================================
                 ERROR
            ================================================== -->

            {% if error %}

                <div
                    class="error"
                    role="alert"
                >

                    {{ error }}

                </div>

            {% endif %}


            <!-- ==================================================
                 URL FORM
            ================================================== -->

            <form
                action="/process"
                method="POST"
            >


                <div class="input-area">


                    <input
                        type="url"
                        name="url"
                        placeholder="https://www.youtube.com/watch?v=..."
                        autocomplete="off"
                        required
                        aria-label="YouTube video URL"
                    >


                    <button
                        type="submit"
                    >

                        Continue

                    </button>


                </div>


            </form>


            <!-- ==================================================
                 ADVERTISEMENT
            ================================================== -->

            <div
                class="ad"
                aria-label="Advertisement"
            >

                ADVERTISEMENT

            </div>


            <!-- ==================================================
                 NOTE
            ================================================== -->

            <p class="note">

                Enter a YouTube URL to continue.

            </p>


        </section>


        <!-- ==================================================
             FOOTER
        ================================================== -->

        <footer class="footer">


            <div>

                © 2026 YTTool. All rights reserved.

            </div>


            <div class="creator">

                Project created by
                <span>AMOE</span>

            </div>


        </footer>


    </main>


</body>

</html>
